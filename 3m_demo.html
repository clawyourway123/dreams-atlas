
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3M Chemical Space Atlas</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { margin: 0; background: #0f1115; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        .sidebar { position: absolute; left: 0; top: 0; width: 300px; height: 100vh; background: rgba(20, 22, 28, 0.95); border-right: 1px solid #333; padding: 20px; z-index: 10; backdrop-filter: blur(10px); }
        .main-view { margin-left: 300px; height: 100vh; width: calc(100vw - 300px); }
        
        h1 { font-size: 20px; font-weight: 600; color: #ff0000; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; }
        h2 { font-size: 14px; color: #888; text-transform: uppercase; margin-top: 20px; }
        
        .stat-card { background: #1a1d24; border: 1px solid #333; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .stat-val { font-size: 24px; font-weight: 700; color: #fff; }
        .stat-label { font-size: 12px; color: #aaa; }

        .btn { width: 100%; padding: 12px; background: #ff0000; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 20px; }
        .btn:hover { background: #ff1a2b; box-shadow: 0 0 15px rgba(225, 0, 15, 0.4); }

        /* Loader */
        .loader { border: 3px solid #333; border-top: 3px solid #ff0000; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="sidebar">
    <h1>3M / Atlas</h1>
    
    <div class="stat-card">
        <div class="stat-val">24,593</div>
        <div class="stat-label">Proprietary Spectra Mapped</div>
    </div>
    <div class="stat-card">
        <div class="stat-val">89.2%</div>
        <div class="stat-label">Coverage of Chemical Space</div>
    </div>

    <h2>Controls</h2>
    <div class="stat-card">
        <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 5px;">Filter by Property</label>
        <select style="width: 100%; background: #111; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 4px;">
            <option>Viscosity</option>
            <option>Cure Speed</option>
            <option>Shear Strength</option>
        </select>
    </div>

    <h2>Similarity</h2>
    <div class="stat-card">
        <label style="font-size: 12px; color: #aaa; display: block; margin-bottom: 5px;">Anchor Spectrum</label>
        <select id="specSelect" style="width: 100%; background: #111; color: #fff; border: 1px solid #444; padding: 5px; border-radius: 4px;">
            <option>Loading spectra...</option>
        </select>
        <button class="btn" style="margin-top: 10px;" onclick="highlightSimilar()">Find Most Similar</button>
    </div>

    <button class="btn" onclick="uploadDataset()">
        <span id="btnText">Upload New Batch (.mgf)</span>
        <div class="loader" id="loader"></div>
    </button>
    <input type="file" id="fileUpload" style="display:none" accept=".mgf,.txt,.csv" onchange="handleFile(this)">
</div>

<div class="main-view" id="scatter3d"></div>

<script>
    const layout = {
        margin: {l:0, r:0, b:0, t:0},
        paper_bgcolor: '#0f1115',
        plot_bgcolor: '#0f1115',
        scene: {
            xaxis: {title: '', showgrid: true, gridcolor: '#333', zerolinecolor: '#333', showticklabels: false, showbackground: false},
            yaxis: {title: '', showgrid: true, gridcolor: '#333', zerolinecolor: '#333', showticklabels: false, showbackground: false},
            zaxis: {title: '', showgrid: true, gridcolor: '#333', zerolinecolor: '#333', showticklabels: false, showbackground: false},
            bgcolor: 'rgba(0,0,0,0)', // Transparent scene bg
            aspectmode: 'cube',
            dragmode: 'turntable'
        }
    };

    // Global cache of points for similarity search
    let atlasData = [];

    function populateSpectrumDropdown(json) {
        const select = document.getElementById('specSelect');
        if (!select || json.length === 0) return;
        select.innerHTML = '';
        
        const placeholder = document.createElement('option');
        placeholder.text = "Select a compound...";
        placeholder.value = "";
        select.appendChild(placeholder);

        // Sort alphabetically
        const sorted = [...json].sort((a, b) => a.id.localeCompare(b.id));
        
        for (let i = 0; i < sorted.length; i++) {
            const opt = document.createElement('option');
            opt.value = sorted[i].id;
            opt.textContent = sorted[i].id;
            select.appendChild(opt);
        }
    }

    function generateData(targetPoints) {
        // Load real data if available, else mock
        fetch('atlas_data.json')
            .then(res => res.json())
            .then(json => {
                atlasData = json; // cache for similarity
                populateSpectrumDropdown(json);

                let x = json.map(d => d.x);
                let y = json.map(d => d.y);
                let z = json.map(d => d.z);
                let colors = json.map(d => d.cluster);

                // Calculate bounds to make simulation look realistic relative to real data
                const minX = Math.min(...x), maxX = Math.max(...x);
                const minY = Math.min(...y), maxY = Math.max(...y);
                const minZ = Math.min(...z), maxZ = Math.max(...z);
                const rangeX = maxX - minX || 10;
                const rangeY = maxY - minY || 10;
                const rangeZ = maxZ - minZ || 10;

                // If we requested more points than exist in the file, generate simulated extras
                // NO SIMULATION - 100% REAL DATA ONLY
                
                let ids = json.map(d => d.id); // Define ids before usage

                // Initialize with TWO traces: Base (all) and Highlight (empty)
                const baseTrace = {
                    x: x, y: y, z: z,
                    mode: 'markers',
                    text: ids,
                    hoverinfo: 'text',
                    marker: { size: 3, color: colors, colorscale: 'Viridis', opacity: 0.8 },
                    type: 'scatter3d',
                    name: 'All spectra'
                };
                
                const highlightTrace = {
                    x: [], y: [], z: [],
                    mode: 'markers',
                    type: 'scatter3d',
                    name: 'Similar',
                    marker: { size: 6, color: '#ff4b5c', opacity: 1.0, line: {color: '#fff', width: 1} }
                };

                Plotly.react('scatter3d', [baseTrace, highlightTrace], layout);

                // WIRE CLICK EVENT
                document.getElementById('scatter3d').on('plotly_click', function(data){
                    if(!data || !data.points) return;
                    const pointIndex = data.points[0].pointNumber;
                    const curveNum = data.points[0].curveNumber;
                    
                    if (curveNum !== 0) return; // Only base layer clicks

                    const selectedId = atlasData[pointIndex].id;
                    console.log("Clicked:", selectedId);
                    
                    const select = document.getElementById('specSelect');
                    if(select) {
                        select.value = selectedId;
                        highlightSimilar();
                    }
                });
            })
            .catch(err => {
                console.log("No backend data found. Run generate_atlas_real.py.");
                // No fake cubes. Show empty or error state.
                const trace = {
                    x: [], y: [], z: [],
                    mode: 'markers',
                    type: 'scatter3d',
                    name: 'No Data'
                };
                const msg = {
                    showlegend: true,
                    annotations: [{
                        text: "No Atlas Data Found<br>Run generate_atlas_real.py",
                        font: { size: 14, color: '#ff4444' },
                        showarrow: false,
                        align: 'center',
                        x: 0.5, y: 0.5
                    }]
                };
                Plotly.react('scatter3d', [trace], {...layout, ...msg});
            });
    }

    generateData(5000);

    function uploadDataset() {
        document.getElementById('fileUpload').click();
    }

    function handleFile(input) {
        if (input.files && input.files[0]) {
            alert("Live uploads are disabled for this demo.\n\nTo add spectra, process the MGF file offline with DreaMS and re-run generate_atlas_real.py.");
            input.value = ""; // clear input
        }
    }

    function highlightSimilar() {
        if (!atlasData || atlasData.length === 0) return;
        
        const select = document.getElementById('specSelect');
        if (!select || !select.value) return;
        
        const anchorId = select.value;
        const anchor = atlasData.find(d => d.id === anchorId);
        if (!anchor) return;

        // Compute distances
        const distances = atlasData.map((d, idx) => {
            const dx = d.x - anchor.x;
            const dy = d.y - anchor.y;
            const dz = d.z - anchor.z;
            return { idx, dist: Math.sqrt(dx*dx + dy*dy + dz*dz) };
        });
        distances.sort((a, b) => a.dist - b.dist);

        const k = 50; 
        const neighbourIdx = distances.slice(0, k).map(d => d.idx);

        const neighX = [];
        const neighY = [];
        const neighZ = [];
        const neighText = [];
        neighbourIdx.forEach(i => {
            neighX.push(atlasData[i].x);
            neighY.push(atlasData[i].y);
            neighZ.push(atlasData[i].z);
            neighText.push(atlasData[i].id);
        });

        // USE RESTYLE (Does not reset camera/layout)
        // Update Trace 1 (the highlight trace)
        Plotly.restyle('scatter3d', {
            x: [neighX],
            y: [neighY],
            z: [neighZ],
            text: [neighText],
            name: `Similar to ${anchorId}`
        }, [1]); // Target trace index 1
    }
</script>

</body>
</html>
