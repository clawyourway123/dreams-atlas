services:
  - type: web
    name: dreams-atlas-api
    env: python
    region: oregon
    plan: starter
    numInstances: 2
    rootDir: .
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: "INFO"
      - key: SENTRY_DSN
        sync: false

  - type: web
    name: dreams-atlas
    runtime: node
    plan: free
    rootDir: dreams-atlas
    buildCommand: bash scripts/render-build.sh
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    healthCheckPath: /
