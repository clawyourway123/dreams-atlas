services:
  - type: web
    name: dreams-atlas
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75"
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
