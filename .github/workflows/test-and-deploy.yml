name: Test & Deploy DreaMS Atlas

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    name: Test Backend & Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov flake8
      
      - name: Lint backend (flake8)
        run: |
          flake8 backend/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run backend tests
        run: |
          pytest backend/tests/ -v --cov=backend --cov-report=xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install Node dependencies
        run: |
          npm install eslint
      
      - name: Lint frontend JS
        run: |
          npx eslint atlas-viewer-lab.js --fix --max-warnings=5

      - name: Validate HTML
        run: |
          npx html-validate index.html henkel_demo.html
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
  
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Trigger Render deployment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d65lbihr0fns73d5j0kg
        run: |
          curl -X POST https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            -w "\nDeploy triggered: %{http_code}\n"
      
      - name: Wait for deployment
        run: sleep 30
      
      - name: Check health endpoint
        run: |
          for i in {1..30}; do
            if curl -f https://dreams-atlas.onrender.com/healthz; then
              echo "✅ Deployment successful"
              exit 0
            fi
            echo "Attempt $i: Waiting for service..."
            sleep 5
          done
          echo "❌ Deployment health check failed"
          exit 1
  
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Lighthouse on Deployment
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://dreams-atlas.onrender.com/
            https://dreams-atlas.onrender.com/henkel_lab_demo.html
          uploadArtifacts: false
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse-budgets.json
        continue-on-error: true

  notify:
    name: Notify on Deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: Send Slack notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ needs.deploy.result }}
        run: |
          if [ "$JOB_STATUS" == "success" ]; then
            STATUS_EMOJI="✅"
            TEXT="DreaMS Atlas deployed successfully to production"
          else
            STATUS_EMOJI="❌"
            TEXT="DreaMS Atlas deployment failed"
          fi
          
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST $SLACK_WEBHOOK -H 'Content-type: application/json' \
              -d "{
                \"text\": \"${STATUS_EMOJI} ${TEXT}\",
                \"blocks\": [{
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"${STATUS_EMOJI} *DreaMS Atlas Deployment*\n${TEXT}\nRef: <https://github.com/clawyourway123/dreams-atlas/commit/${{ github.sha }}|${{ github.sha }}>\nAuthor: ${{ github.actor }}\"
                  }
                }]
              }"
          fi
        continue-on-error: true
